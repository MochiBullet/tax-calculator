<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消費税計算</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #06080c;
            --bg-card: #0d1117;
            --border: rgba(255,255,255,0.06);
            --text: #e6edf3;
            --text-muted: #8b949e;
            --text-dim: #484f58;
            --primary: #6C9CFF;
            --accent-purple: #c084fc;
            --accent-green: #4ade80;
            --accent-orange: #fb923c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header { text-align: center; padding: 24px 0 8px; }
        .header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p { color: var(--text-dim); font-size: 12px; margin-top: 4px; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }

        /* === Input === */
        .input-wrap {
            position: relative;
        }
        .input-wrap input {
            width: 100%;
            padding: 18px 50px 18px 18px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 32px;
            font-weight: 700;
            font-family: 'SF Mono', 'Fira Code', monospace;
            text-align: right;
            outline: none;
            transition: border-color 0.2s;
            -moz-appearance: textfield;
        }
        .input-wrap input::-webkit-outer-spin-button,
        .input-wrap input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .input-wrap input:focus { border-color: var(--primary); }
        .input-wrap input::placeholder { color: var(--text-dim); font-weight: 400; font-size: 18px; }
        .input-yen {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 24px;
            font-weight: 600;
            pointer-events: none;
        }

        /* === Pill toggles === */
        .toggle-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .pill-toggle {
            flex: 1;
            display: flex;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: rgba(255,255,255,0.02);
        }
        .pill-opt {
            flex: 1;
            padding: 10px 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.15s;
        }
        .pill-opt.active {
            background: rgba(108,156,255,0.15);
            color: var(--primary);
            font-weight: 600;
        }

        /* === Result === */
        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        .result-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 22px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .result-row:hover { background: rgba(255,255,255,0.02); }
        .result-row:not(:last-child) { border-bottom: 1px solid var(--border); }
        .result-row.highlight {
            background: rgba(108,156,255,0.05);
        }
        .result-row.highlight:hover {
            background: rgba(108,156,255,0.08);
        }
        .result-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
        }
        .result-label small {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 2px;
        }
        .result-value {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-weight: 700;
            color: var(--text);
        }
        .result-value.large {
            font-size: 26px;
        }
        .result-value.medium {
            font-size: 18px;
        }
        .result-value.highlight {
            color: var(--primary);
        }
        .result-value-yen {
            font-size: 0.6em;
            color: var(--text-dim);
            margin-left: 2px;
            font-weight: 500;
        }

        /* === Toast === */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--accent-green);
            color: #000;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .footer {
            text-align: center;
            margin-top: 12px;
            color: var(--text-dim);
            font-size: 11px;
        }
        .footer a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>消費税計算</h1>
            <p>金額を入力して内税・外税をパッと計算</p>
        </div>

        <div class="card">
            <div class="input-wrap">
                <input type="number" id="amount" placeholder="金額を入力" inputmode="decimal" step="any">
                <span class="input-yen">円</span>
            </div>

            <div class="toggle-row">
                <div class="pill-toggle" id="modeToggle">
                    <button class="pill-opt active" data-mode="exclusive">外税</button>
                    <button class="pill-opt" data-mode="inclusive">内税</button>
                </div>
                <div class="pill-toggle" id="rateToggle">
                    <button class="pill-opt active" data-rate="10">10%</button>
                    <button class="pill-opt" data-rate="8">8%</button>
                </div>
            </div>
        </div>

        <div class="result-card">
            <div class="result-row highlight" id="rowMain" onclick="copyValue('main')">
                <div class="result-label">
                    <span id="mainLabel">税込価格</span>
                    <small>tap to copy</small>
                </div>
                <div class="result-value large highlight" id="mainValue">0<span class="result-value-yen">円</span></div>
            </div>
            <div class="result-row" onclick="copyValue('sub')">
                <div class="result-label">
                    <span id="subLabel">税抜価格</span>
                </div>
                <div class="result-value medium" id="subValue">0<span class="result-value-yen">円</span></div>
            </div>
            <div class="result-row" onclick="copyValue('tax')">
                <div class="result-label">
                    <span>消費税額</span>
                </div>
                <div class="result-value medium" id="taxValue">0<span class="result-value-yen">円</span></div>
            </div>
        </div>

        <div class="footer">
            Made by <a href="https://mochi-bullet-magazine.vercel.app/" target="_blank">MochiBullet</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    const amountInput = document.getElementById('amount');
    const modeToggle = document.getElementById('modeToggle');
    const rateToggle = document.getElementById('rateToggle');
    const mainLabel = document.getElementById('mainLabel');
    const subLabel = document.getElementById('subLabel');
    const mainValue = document.getElementById('mainValue');
    const subValue = document.getElementById('subValue');
    const taxValue = document.getElementById('taxValue');

    let mode = 'exclusive'; // 'exclusive' = 外税, 'inclusive' = 内税
    let rate = 10;

    // Toggle: mode
    modeToggle.addEventListener('click', (e) => {
        const btn = e.target.closest('.pill-opt');
        if (!btn) return;
        modeToggle.querySelectorAll('.pill-opt').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        calculate();
    });

    // Toggle: rate
    rateToggle.addEventListener('click', (e) => {
        const btn = e.target.closest('.pill-opt');
        if (!btn) return;
        rateToggle.querySelectorAll('.pill-opt').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        rate = parseInt(btn.dataset.rate);
        calculate();
    });

    // Input
    amountInput.addEventListener('input', calculate);

    // Format with commas
    function formatYen(n) {
        return Math.round(n).toLocaleString('ja-JP') + '<span class="result-value-yen">円</span>';
    }

    function calculate() {
        const val = parseFloat(amountInput.value);
        if (isNaN(val) || amountInput.value === '') {
            mainValue.innerHTML = '0<span class="result-value-yen">円</span>';
            subValue.innerHTML = '0<span class="result-value-yen">円</span>';
            taxValue.innerHTML = '0<span class="result-value-yen">円</span>';
            return;
        }

        const r = rate / 100;
        let inclusive, exclusive, tax;

        if (mode === 'exclusive') {
            // 外税: 入力は税抜き、計算で税込み
            exclusive = val;
            tax = val * r;
            inclusive = val + tax;
            // メイン表示: 税込価格
            mainLabel.textContent = '税込価格';
            subLabel.textContent = '税抜価格';
            mainValue.innerHTML = formatYen(inclusive);
            subValue.innerHTML = formatYen(exclusive);
        } else {
            // 内税: 入力は税込み、計算で税抜き
            inclusive = val;
            exclusive = val / (1 + r);
            tax = inclusive - exclusive;
            // メイン表示: 税抜価格
            mainLabel.textContent = '税抜価格';
            subLabel.textContent = '税込価格';
            mainValue.innerHTML = formatYen(exclusive);
            subValue.innerHTML = formatYen(inclusive);
        }

        taxValue.innerHTML = formatYen(tax);
    }

    function copyValue(which) {
        let text = '';
        if (which === 'main') text = mainValue.textContent.replace('円', '').trim();
        if (which === 'sub') text = subValue.textContent.replace('円', '').trim();
        if (which === 'tax') text = taxValue.textContent.replace('円', '').trim();
        if (!text || text === '0') return;
        const raw = text.replace(/,/g, '');
        navigator.clipboard.writeText(raw).then(() => {
            showToast(text + '円 をコピー');
        });
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1800);
    }

    amountInput.focus();
    </script>
</body>
</html>
